<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101613" />
    <meta name="description" content="Açık dünyada sür, kazan ve garajını büyüt." />
    <title>Autodrom — Drive & Build</title>
    <style>
      /* Inline so the loading screen shows before the game bundle arrives. */
      #loading {
        position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: radial-gradient(circle at 50% 38%, #1c2a22 0%, #101613 62%); color: #e8f1ea;
        font-family: 'Space Grotesk', 'Manrope', system-ui, sans-serif; transition: opacity .45s ease;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      .loading-brand { display: flex; align-items: center; gap: 12px; }
      .loading-mark { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 11px; background: #b8edc9; color: #102019; font-weight: 800; font-size: 24px; font-style: italic; }
      .loading-brand b { font-size: 26px; letter-spacing: .08em; }
      .loading-track { width: min(340px, 70vw); height: 4px; overflow: hidden; border-radius: 4px; background: rgba(184, 237, 201, .13); }
      .loading-fill { width: 0%; height: 100%; border-radius: 4px; background: #b8edc9; box-shadow: 0 0 12px rgba(184, 237, 201, .5); transition: width .2s ease; }
      .loading-status { display: flex; justify-content: space-between; width: min(340px, 70vw); color: #8b9a8f; font: 500 10px 'DM Mono', ui-monospace, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; }
      @media (prefers-reduced-motion: reduce) { #loading, .loading-fill { transition: none; } }
    </style>
  </head>
  <body>
    <div id="game" aria-label="Autodrom araba tycoon oyunu"></div>
    <div id="interface"></div>
    <div id="loading" role="progressbar" aria-label="Oyun yükleniyor" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="loading-brand"><span class="loading-mark">A</span><b>AUTODROM</b></div>
      <div class="loading-track"><div class="loading-fill"></div></div>
      <div class="loading-status"><span class="loading-label">Yükleniyor</span><span class="loading-percent">0%</span></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
